name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool
        pip install buildozer
    
    - name: Accept SDK licenses (auto)
      run: |
        mkdir -p ~/.android
        echo "### User License for Android SDK" > ~/.android/repositories.cfg
        yes | ~/../buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses 2>/dev/null || echo "Licenses accepted or already in place"
    
    - name: Build APK
      run: buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tetris-apk
        path: bin/*.apk
